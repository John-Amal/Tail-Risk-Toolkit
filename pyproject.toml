[project]
name = "tailrisk-mcp"
version = "0.1.0"
description = "MCP server exposing extreme value tail-risk analytics (GPD fits, VaR/ES, return levels, VaR backtests)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "numpy>=1.24", "scipy>=1.10", "pydantic>=2.6"]

[project.scripts]
tailrisk-mcp = "tailrisk_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailrisk_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
